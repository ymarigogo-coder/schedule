<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オープンキャンパス 絞り込みデモ</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#273044;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:42px auto;padding:0 18px}h1{font-size:25px;margin:0 0 8px}.lead{color:#657086;margin:0 0 26px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:1px solid #cbd1dd;border-radius:8px;background:white;color:#273044;padding:11px 17px;cursor:pointer;font-size:14px;font-weight:650}.btn.primary{background:#d94774;color:white;border-color:#d94774}.btn:hover{filter:brightness(.97)}.panel{background:#fff;border:1px solid #e2e5ec;border-radius:13px;padding:23px;margin:18px 0;box-shadow:0 5px 18px #19253d0b}.panel[hidden]{display:none}h2{font-size:17px;margin:0 0 15px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #d7dce5;border-radius:25px;padding:9px 13px;cursor:pointer;font-size:14px}.chip:has(input:checked){background:#fff0f5;border-color:#d94774;color:#a92d56}.chip input{accent-color:#d94774}.dates{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dates input{border:1px solid #cbd1dd;border-radius:7px;padding:10px;font-size:14px;max-width:100%}.section{margin:0 0 24px}.actions{display:flex;justify-content:flex-end;gap:10px}.summary{margin:26px 0 14px;font-size:18px;font-weight:700}.summary span{color:#d94774;font-size:26px}.cards{display:grid;gap:14px}.card{background:white;border:1px solid #e2e5ec;border-radius:12px;padding:20px}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#697389;font-size:13px}.tag{border-radius:5px;background:#fff0f5;color:#b3325e;padding:4px 9px}.card h3{font-size:17px;line-height:1.6;margin:12px 0 15px}.apply{color:#c53665;font-size:14px;text-decoration:none;font-weight:700}.note{font-size:12px;color:#798296;margin-top:22px;line-height:1.7}.empty{background:white;padding:30px;border-radius:12px;text-align:center;color:#697389}@media(max-width:600px){.wrap{margin:25px auto}.panel{padding:17px}.dates{align-items:stretch}.dates label{width:100%}.dates input{width:100%}}
</style></head><body><main class="wrap"><div class="top"><div><h1>オープンキャンパス</h1><p class="lead">体験したいメニューからイベントを探そう</p></div><button class="btn primary" id="toggle" type="button" aria-expanded="false" aria-controls="filterPanel">☷ 絞り込み ▾</button></div>
<section class="panel" id="filterPanel" hidden><div class="section"><h2>体験メニューから探す</h2><div class="chips" id="categories"></div></div><div class="section"><h2>開催日から探す</h2><div class="dates"><label>開始日 <input type="date" id="start"></label><span>〜</span><label>終了日 <input type="date" id="end"></label></div></div><div class="actions"><button type="button" class="btn" id="clear">クリア</button><button type="button" class="btn primary" id="search">この条件で絞り込む</button></div></section>
<div class="summary" id="summary" aria-live="polite"></div><div class="cards" id="results"></div><p class="note">※これは動作確認用デモです。イベントはサンプルデータであり、申込リンクは設置していません。実サイトではPHPが出力したHTMLとページ送りを読み取る処理に置き換えます。</p></main>
<script>
// PHPが出力したイベントHTMLを想定したデモデータ。
const events=[
{id:1,date:'2026-11-15',title:'【カット】ウィッグを使って国家試験課題に挑戦🙌'},
{id:2,date:'2026-11-22',title:'【メイク】クリスマスにも使える♡トレンド冬メイクレッスン🎄'},
{id:3,date:'2026-11-29',title:'【ネイル】冬にぴったり✨キラキラネイルを作ろう💎'},
{id:4,date:'2026-12-06',title:'【アイブロウ】似合わせアイブロウテクニックを学ぼう🐾'},
{id:5,date:'2026-12-13',title:'【カット】【メイク】ヘア＆メイクのW体験'},
{id:6,date:'2026-12-20',title:'【ネイル】ホリデーネイルに挑戦'},
{id:7,date:'2027-01-10',title:'【カット】はじめてのカット体験'}
];
const getCategories=title=>[...title.matchAll(/【([^】]+)】/g)].map(m=>m[1].trim());
const allCategories=[...new Set(events.flatMap(e=>getCategories(e.title)))];
const categoriesEl=document.getElementById('categories');
allCategories.forEach(cat=>{const label=document.createElement('label');label.className='chip';const input=document.createElement('input');input.type='checkbox';input.value=cat;label.append(input,document.createTextNode(cat));categoriesEl.append(label)});
const panel=document.getElementById('filterPanel');const toggle=document.getElementById('toggle');
toggle.addEventListener('click',()=>{panel.hidden=!panel.hidden;toggle.setAttribute('aria-expanded',String(!panel.hidden));toggle.textContent=panel.hidden?'☷ 絞り込み ▾':'☷ 絞り込み ▴'});
function render(list,filtered=false){const summary=document.getElementById('summary');summary.replaceChildren();if(filtered){const count=document.createElement('span');count.textContent=list.length;summary.append('検索結果：',count,' 件')}else{summary.textContent='イベント一覧（'+list.length+'件）'}const root=document.getElementById('results');root.replaceChildren();if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='該当するイベントはありません。条件を変更してお試しください。';root.append(empty);return}list.forEach(event=>{const card=document.createElement('article');card.className='card';const meta=document.createElement('div');meta.className='meta';const date=document.createElement('span');date.textContent=event.date.replaceAll('-','/');meta.append(date);getCategories(event.title).forEach(cat=>{const tag=document.createElement('span');tag.className='tag';tag.textContent=cat;meta.append(tag)});const title=document.createElement('h3');title.textContent=event.title;const link=document.createElement('span');link.className='apply';link.textContent='イベント詳細・お申し込み（デモ）';card.append(meta,title,link);root.append(card)})}
document.getElementById('search').addEventListener('click',()=>{const chosen=[...categoriesEl.querySelectorAll('input:checked')].map(el=>el.value);const start=document.getElementById('start').value;const end=document.getElementById('end').value;if(start&&end&&start>end){alert('終了日は開始日以降にしてください。');return}const filtered=events.filter(e=>(!chosen.length||getCategories(e.title).some(c=>chosen.includes(c)))&&(!start||e.date>=start)&&(!end||e.date<=end));render(filtered,true);panel.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.textContent='☷ 絞り込み ▾'});
document.getElementById('clear').addEventListener('click',()=>{categoriesEl.querySelectorAll('input').forEach(el=>el.checked=false);document.getElementById('start').value='';document.getElementById('end').value='';render(events)});
render(events);
</script></body></html>
